<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu projeto web</title>
  <!-- Conecta o arquivo de estilos. -->
  <link rel="stylesheet" href="style.css">
  <!-- defer aguarda o HTML ser lido antes de executar o JavaScript. -->
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Meu projeto web</h1>
    <p>HTML, CSS e JavaScript conectados.</p>
    <button id="botao" type="button">Testar JavaScript</button>
    <p id="mensagem" role="status"></p>
  </main>
</body>
</html>
